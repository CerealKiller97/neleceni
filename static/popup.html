<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neleceni</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; padding: 14px 16px 16px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      header img { width: 24px; height: 24px; }
      header strong { font-size: 15px; flex: 1; }
      .state { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; margin: 12px 0; }
      .state .big { font-weight: 700; font-size: 15px; }
      .state.muted .big { color: var(--accent); }
      .state.listening .big { color: var(--ok); }
      .buttons { display: flex; gap: 8px; }
      .buttons button { flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <strong>Neleceni</strong>
    </header>
    <label class="check"><input type="checkbox" id="enabled" /> Enabled</label>
    <div class="state" id="state">
      <div class="big" id="headline">…</div>
      <div class="hint" id="detail"></div>
    </div>
    <div class="buttons">
      <button type="button" id="toggle" class="primary">Mute / un-mute</button>
      <button type="button" id="settings">Settings</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
